content:
  intro: >-
    Jess Dolan is a graphic designer/photographer with extensive experience
    crafting compelling visual stories across a diverse portfolio of projects.
  approach: >-
    With a keen eye for detail and a commitment to excellence, Jess brings a
    thoughtful, strategic approach to every creative challenge — whether
    developing brand identities, capturing moments through the lens, or
    designing impactful visual communications.
  collaboration: >-
    Each project is an opportunity to collaborate closely with clients,
    translating their vision into polished, purposeful work that resonates with
    audiences and delivers results.
